<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player Mobile Friendly</title>
    <style>
        /* Reset dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Container utama yang responsif */
        .video-card {
            width: 100%;
            max-width: 700px; /* Lebar maksimal di desktop */
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Wrapper untuk menjaga rasio video 16:9 */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            background: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memastikan video memenuhi area */
        }

        /* Bagian teks di bawah video */
        .video-info {
            padding: 20px;
        }

        .video-info h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 8px;
        }

        .video-info p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }

        /* Optimasi khusus Layar HP (Mobile) */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .video-info {
                padding: 15px;
            }

            .video-info h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="video-card">
    <div class="video-wrapper">
        <video controls playsinline poster="thumb-service.jpg">
            <source src="vid/khdj.mp4" type="video/mp4">
            Browser Anda tidak mendukung pemutar video.
        </video>
    </div>
    
    <div class="video-info">
        <h2>Proses Service MacBook</h2>
        <p>Lihat bagaimana teknisi profesional kami menangani perbaikan komponen internal dengan presisi tinggi.</p>
    </div>
</div>

</body>
</html>
